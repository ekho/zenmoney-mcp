[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zenmoney-mcp"
version = "0.2.0"
description = "Read-only MCP server for trustworthy personal finance analytics over ZenMoney API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
zenmoney-mcp = "zenmoney_mcp.entrypoint:main"
zenmoney-mcp-http = "zenmoney_mcp.http_server:main"
zenmoney-sync-once = "zenmoney_mcp.sync_worker:sync_once_main"
zenmoney-sync-worker = "zenmoney_mcp.sync_worker:main"
zenmoney-db-backup = "zenmoney_mcp.backup:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zenmoney_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
