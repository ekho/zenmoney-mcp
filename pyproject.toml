[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zenmoney-mcp"
version = "0.4.1"
description = "MCP server for trustworthy ZenMoney analytics and confirmed user-entity changes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
zenmoney-mcp = "zenmoney_mcp.entrypoint:main"
zenmoney-mcp-http = "zenmoney_mcp.http_server:main"
zenmoney-sync-once = "zenmoney_mcp.sync_worker:sync_once_main"
zenmoney-sync-worker = "zenmoney_mcp.sync_worker:main"
zenmoney-db-backup = "zenmoney_mcp.backup:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zenmoney_mcp"]

[tool.semantic_release]
allow_zero_version = true
major_on_zero = true
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""
commit_author = "github-actions <actions@github.com>"
commit_message = "chore(release): v{version} [skip ci]"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/zenmoney_mcp/__init__.py:__version__"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
