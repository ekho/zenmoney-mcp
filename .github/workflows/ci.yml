name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest tests/ -v --ignore=tests/test_integration.py

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build image
        run: docker build -t zenmoney-mcp:remote-test .
      - name: Validate Compose
        run: docker compose -f deploy/remote-mcp/compose.yaml config -q
      - name: Test static deployment contract
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_remote_deployment.py -q

  remote-mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Exercise local Streamable HTTP MCP
        run: python -m pytest tests/test_remote_http.py -q
