name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest tests/ -v --ignore=tests/test_integration.py

  docker-compose:
    runs-on: ubuntu-latest
    env:
      CONTROL_PLANE_TUNNEL_ID: tunnel_0123456789abcdef0123456789abcdef
      ZENMONEY_IMAGE: zenmoney-mcp:remote-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Build wheel
        run: uv build --wheel --no-sources
      - name: Build image
        run: docker build -t zenmoney-mcp:remote-test .
      - name: Prepare synthetic ZenMoney secret
        run: |
          set -e
          umask 077
          temporary_secret="$(mktemp)"
          trap 'rm -f "$temporary_secret"' EXIT
          printf '%s' 'ci-synthetic-token' > "$temporary_secret"
          sudo install -o 10001 -g 10001 -m 0400 "$temporary_secret" \
            deploy/remote-mcp/secrets/zenmoney-token
      - name: Validate Compose
        run: docker compose -f deploy/remote-mcp/compose.yaml config -q
      - name: Test static deployment contract
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_remote_deployment.py -q
      - name: Smoke final read-only MCP service and sync secret
        run: |
          set -e
          compose=(docker compose -f deploy/remote-mcp/compose.yaml)
          cleanup() { "${compose[@]}" down -v --remove-orphans; }
          trap cleanup EXIT
          "${compose[@]}" run --rm --no-deps --entrypoint python zenmoney-sync -c "import os; from pathlib import Path; from zenmoney_mcp.hardened_database import HardenedDatabase; from zenmoney_mcp.sync_worker import read_secret; assert os.getuid() == 10001; secret=Path('/run/secrets/zenmoney-token'); stat=secret.stat(); assert (stat.st_uid, stat.st_gid, stat.st_mode & 0o777) == (10001, 10001, 0o400); assert read_secret('ZENMONEY_TOKEN'); control=Path('/sync-control/probe'); control.write_text('ok'); control.unlink(); db=HardenedDatabase('/data/zenmoney.db', journal_mode='DELETE'); db.init_schema(); db.close()"
          "${compose[@]}" up -d --no-deps zenmoney-mcp
          for attempt in {1..20}; do
            if "${compose[@]}" exec -T zenmoney-mcp python -c "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/readyz', timeout=2).status == 200"; then
              break
            fi
            if [ "$attempt" = 20 ]; then
              "${compose[@]}" logs zenmoney-mcp
              exit 1
            fi
            sleep 1
          done
          container_id="$("${compose[@]}" ps -q zenmoney-mcp)"
          docker inspect "$container_id" | python -c 'import json,sys; container=json.load(sys.stdin)[0]; mounts={item["Destination"]: item for item in container["Mounts"]}; assert mounts["/data"]["RW"] is False; assert mounts["/sync-control"]["RW"] is True'

  remote-mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Exercise local Streamable HTTP MCP
        run: python -m pytest tests/test_remote_http.py -q

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, docker-compose, remote-mcp-smoke]
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Use the tested revision
        run: git reset --hard "${{ github.sha }}"
      - name: Require the v0.2.0 release baseline
        run: >-
          git merge-base --is-ancestor
          "refs/tags/v0.2.0^{commit}"
          "${{ github.sha }}"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Create semantic release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ponytail: GitPython 3.1.59 avoids PSR #1476; remove the pin after a fixed PSR release.
        run: |
          previous_tag="$(git describe --tags --abbrev=0)"
          semantic_release_output="$(mktemp)"
          trap 'rm -f "$semantic_release_output"' EXIT
          GITHUB_OUTPUT="$semantic_release_output" uvx --from python-semantic-release==10.6.1 \
            --with GitPython==3.1.59 \
            semantic-release version --no-changelog
          released_tag="$(git describe --tags --abbrev=0)"
          if [ "$released_tag" = "$previous_tag" ]; then
            exit 0
          fi
          version="${released_tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build distributions
        if: steps.release.outputs.version != ''
        run: uv build --no-sources
      - name: Smoke wheel
        if: steps.release.outputs.version != ''
        run: uv run --isolated --no-project --with dist/*.whl python -c "import zenmoney_mcp"
      - name: Smoke source distribution
        if: steps.release.outputs.version != ''
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c "import zenmoney_mcp"
      - name: Upload distributions
        if: steps.release.outputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-image:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Prepare image metadata
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ needs.release.outputs.version }}
            ${{ steps.image.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}

  publish-pypi:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zenmoney-mcp-server
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish distributions
        run: uv publish
